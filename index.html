<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#075d30">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Court Timer">
  <meta name="description" content="A large, mobile-friendly badminton game and changeover timer.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Badminton Court Timer</title>
</head>
<body data-phase="ready">
  <main id="app" class="app" aria-live="polite">
    <header class="topbar">
      <div class="brand" aria-label="Badminton Court Timer">
        <svg aria-hidden="true" viewBox="0 0 40 40"><path d="M13 4 7 8l8 17 5-3L13 4Zm3 22 5-3 9 10c1.5 1.7-.8 4-2.5 2.5L16 26Zm-6-17 3-2 2 5-3 2-2-5Zm3 7 3-2 2 5-3 2-2-5Z"/></svg>
        <span>Court Timer</span>
      </div>
      <div class="top-actions">
        <button id="soundButton" class="icon-button" type="button" aria-label="Sound on" title="Sound on">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4V9Zm12.2-.8a5.4 5.4 0 0 1 0 7.6l-1.4-1.4a3.4 3.4 0 0 0 0-4.8l1.4-1.4Zm2.7-2.7a9.2 9.2 0 0 1 0 13l-1.4-1.4a7.2 7.2 0 0 0 0-10.2l1.4-1.4Z"/></svg>
        </button>
        <button id="settingsButton" class="icon-button" type="button" aria-label="Open settings" title="Settings">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.6 1a8 8 0 0 0-1.7-1L14.8 3h-4l-.4 2.8a8 8 0 0 0-1.7 1L6 5.8l-2 3.5L6.2 11a7.7 7.7 0 0 0 0 2L4 14.6l2 3.5 2.6-1a8 8 0 0 0 1.7 1l.4 2.8h4l.4-2.8a8 8 0 0 0 1.7-1l2.6 1 2-3.5L19.4 13ZM12.8 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
        </button>
      </div>
    </header>

    <section class="scoreboard" aria-labelledby="gameLabel">
      <p id="phaseKicker" class="phase-kicker">READY</p>
      <h1 id="gameLabel" class="game-label">GAME 1</h1>
      <div id="timeDisplay" class="time-display" role="timer" aria-label="3 minutes 30 seconds remaining">03:30</div>
      <p id="statusText" class="status-text">Press start when the court is ready</p>
      <div class="progress-track" aria-hidden="true"><div id="progressBar" class="progress-bar"></div></div>
    </section>

    <section class="controls" aria-label="Timer controls">
      <div class="primary-row">
        <button id="startPauseButton" class="control primary" type="button">
          <span class="control-icon" aria-hidden="true">▶</span><span id="startPauseLabel">START</span>
        </button>
        <button id="resetButton" class="control" type="button">
          <span class="control-icon" aria-hidden="true">↻</span><span>RESET</span>
        </button>
      </div>
      <div class="secondary-row">
        <button id="previousButton" class="control compact" type="button" disabled><span aria-hidden="true">‹</span> PREVIOUS</button>
        <button id="fullscreenButton" class="control compact" type="button">FULL SCREEN</button>
        <button id="nextButton" class="control compact" type="button">NEXT <span aria-hidden="true">›</span></button>
      </div>
      <p id="fullscreenHint" class="fullscreen-hint" hidden>Press Esc to exit full screen</p>
    </section>
  </main>

  <div id="settingsBackdrop" class="backdrop" hidden></div>
  <aside id="settingsPanel" class="settings-panel" aria-labelledby="settingsTitle" aria-hidden="true">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="settings-heading">
      <div>
        <p class="eyebrow">SESSION SETUP</p>
        <h2 id="settingsTitle">Timer settings</h2>
      </div>
      <button id="closeSettingsButton" class="close-button" type="button" aria-label="Close settings">×</button>
    </div>

    <form id="settingsForm" novalidate>
      <label class="field full-field">
        <span>Total games</span>
        <input id="totalGamesInput" type="number" inputmode="numeric" min="1" max="999" value="20" required>
      </label>

      <fieldset>
        <legend>Game duration</legend>
        <label class="field"><span>Minutes</span><input id="gameMinutesInput" type="number" inputmode="numeric" min="0" max="99" value="3" required></label>
        <label class="field"><span>Seconds</span><input id="gameSecondsInput" type="number" inputmode="numeric" min="0" max="59" value="30" required></label>
      </fieldset>

      <fieldset>
        <legend>Changeover</legend>
        <label class="field"><span>Minutes</span><input id="breakMinutesInput" type="number" inputmode="numeric" min="0" max="99" value="1" required></label>
        <label class="field"><span>Seconds</span><input id="breakSecondsInput" type="number" inputmode="numeric" min="0" max="59" value="0" required></label>
      </fieldset>

      <label class="toggle-row">
        <span><strong>10-second warning</strong><small>Short beep each second</small></span>
        <input id="warningInput" type="checkbox" checked><span class="switch" aria-hidden="true"></span>
      </label>

      <p id="settingsError" class="form-error" role="alert"></p>
      <button class="apply-button" type="submit">APPLY SETTINGS</button>
      <button id="installButton" class="install-button" type="button" hidden>INSTALL ON THIS DEVICE</button>
      <p id="installHelp" class="install-help">On iPhone: tap Share, then “Add to Home Screen”.</p>
    </form>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
